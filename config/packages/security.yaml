security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _username
                password_parameter: _password
            logout:
                path: app_logout
                target: /
            access_denied_url: /access-denied
            # Rate limiting natif Symfony : 5 tentatives par minute par IP+email
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    access_control:
        # Pages publiques — accessibles sans connexion
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/access-denied, roles: PUBLIC_ACCESS }

        # Zone admin — réservée aux admins
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Zone professionnel
        - { path: ^/professional-compte, roles: ROLE_PROFESSIONAL }

        # Zone particulier
        - { path: ^/individual-compte, roles: ROLE_INDIVIDUAL }

        # Zone demandes directes (particuliers uniquement)
        - { path: ^/individual/direct-request, roles: ROLE_INDIVIDUAL }

        # Pages d'offres et de demandes — tout utilisateur connecté
        - { path: ^/offer, roles: ROLE_USER }

        # Le reste du site est public (pages vitrine, listing pros, blog, etc.)
        - { path: ^/, roles: PUBLIC_ACCESS }


when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
