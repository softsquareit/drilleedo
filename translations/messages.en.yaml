  cta_title: "Ready to Start Your Next Home Project?"
  cta_sub: "Connect with verified professionals and bring your renovation vision to life. Free quotes, trusted experts, no commitment."
  cta_btn_find: "Find a Professional"
  cta_btn_join: "Join as a Pro"

# ── How it works (Pros) ─────────────────────────────────────────────────────
hitwp:
  meta_title: "How It Works for Professionals | Drilleedo"
  meta_desc: "Learn exactly how Drilleedo connects Canadian renovation professionals with high-value homeowners. A step-by-step guide to growing your business on our platform."
  hero_eyebrow: "Clear Process"
  hero_title_1: "How Drilleedo Works for "
  hero_title_2: "Professionals"
  hero_sub: "A straightforward process designed to strip away the complex marketing jargon and focus on exactly what you want: connecting with homeowners who need your expertise."
  process_eyebrow: "Step by Step"
  process_title_1: "The Path to "
  process_title_2: "More Projects"
  process_sub: "Join in minutes, get verified, and watch your project pipeline grow organically without cold calling or heavy ad spend."
  step1_lbl: "Step 01"
  step1_title: "Build Your Professional Profile"
  step1_desc: "Sign up and create your virtual storefront. You'll define your specific service categories (e.g., Plumbing, Kitchen Demo), set your operating radius, and upload photos to a high-quality portfolio. This ensures you only attract the work you actually want to do."
  step2_lbl: "Step 02"
  step2_title: "Complete Verification (Badge)"
  step2_desc: "Our team reviews your submission. By uploading a government ID and confirming business licenses (like RBQ), you earn the authoritative <em>Drilleedo Verified Badge</em>. High-trust profiles receive up to 3x more direct quotes from site visitors."
  step3_lbl: "Step 03"
  step3_title: "Receive Direct Requests"
  step3_desc: "Homeowners browse the marketplace and find your profile in local search results. When your work matches their vision, they click 'Request Quote' to message you directly. You get an instant notification via your dashboard and email."
  step4_lbl: "Step 04"
  step4_title: "Quote, Hire, and Review"
  step4_desc: "Discuss the project specifics, visit the site, and secure the contract on your own terms (we take absolutely zero commission). After completion, we help collect a certified review to continuously boost your ranking."
  lead_eyebrow: "Lead Quality"
  lead_title_1: "What Does a Drilleedo Lead "
  lead_title_2: "Look Like?"
  lead_sub: "Not all leads are created equal. We pre-filter user intent so you only spend time talking to clients ready to hire."
  lead_hdr_title: "The Anatomy of a Perfect Request"
  lead_hdr_sub: "Every direct message you receive includes vital project context."
  lead_card1_title: "Location Match"
  lead_card1_desc: "We verify the project postal code sits securely inside the active service radius you defined in your dashboard."
  lead_card2_title: "Clear Description"
  lead_card2_desc: "Clients are prompted to provide project specifics, preventing vague requests. You'll know if it's a quick fix or a total overhaul."
  lead_card3_title: "Direct Connection"
  lead_card3_desc: "You own the relationship immediately. No blind bidding wars. The client specifically chose your profile based on your work."
  cta_eyebrow: "Launch Today"
  cta_title: "Put Your Network on Autopilot"
  cta_btn_create: "Create Your Professional Account"
  cta_btn_explore: "Explore Pro Packages"

