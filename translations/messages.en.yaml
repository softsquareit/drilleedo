hitwp:
  meta_title: "How It Works for Professionals | Drilleedo"
  meta_desc: "Learn exactly how Drilleedo connects Canadian renovation professionals with high-value homeowners. A step-by-step guide to growing your business on our platform."
  hero_eyebrow: "Clear Process"
  hero_title_1: "How Drilleedo Works for "
  hero_title_2: "Professionals"
  hero_sub: "A straightforward process designed to strip away the complex marketing jargon and focus on exactly what you want: connecting with homeowners who need your expertise."
  process_eyebrow: "Step by Step"
  process_title_1: "The Path to "
  process_title_2: "More Projects"
  process_sub: "Join in minutes, get verified, and watch your project pipeline grow organically without cold calling or heavy ad spend."
  step1_lbl: "Step 01"
  step1_title: "Build Your Professional Profile"
  step1_desc: "Sign up and create your virtual storefront. You'll define your specific service categories (e.g., Plumbing, Kitchen Demo), set your operating radius, and upload photos to a high-quality portfolio. This ensures you only attract the work you actually want to do."
