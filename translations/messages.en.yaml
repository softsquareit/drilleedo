  # FAQ
  faq_eyebrow: "FREQUENTLY ASKED QUESTIONS — I'M LOOKING FOR A PROFESSIONAL"
  faq_title: "All your questions — answers that are"
  faq_title_span: "clear, honest and straight to the point."
  faq_q1: "Is it really free to search for a professional on Drilleedo?"
  faq_a1: "Yes — 100% free. Always. No exceptions. Browsing our directory, viewing profiles, reading reviews and contacting professionals costs you nothing. No subscription, no hidden fees, no credit card required.<br><br>→ No mandatory sign-up to browse the directory<br>→ Create a profile for free to save favourites and track your exchanges<br>→ Contact as many professionals as you like — at no cost"
  faq_q2: "How do I know if the professionals are reliable?"
  faq_a2: "Every professional visible in our directory is an active subscriber verified by Drilleedo. We check their certifications, licences and accreditations before displaying them. Furthermore, every review on Drilleedo comes from a verified real client — zero fake reviews, zero manipulation.<br><br>→ Certifications and RBQ licences verified before listing<br>→ Authentic reviews from real Drilleedo clients only<br>→ Only pros with an active subscription appear — zero ghost profiles<br>→ Real project portfolio — verified before/after photos"
  faq_q3: "Can I contact several professionals at the same time?"
  faq_a3: "Absolutely — and it's even recommended! On Drilleedo, you can view and contact as many professionals as you like, with no limit. Compare profiles, exchange with multiple pros simultaneously and make the best decision — in complete freedom.<br><br>→ No contact limit — compare freely<br>→ Add your favourite profiles to find them easily<br>→ Manage all your exchanges from your centralized dashboard"
  faq_q4: "What is the difference between searching the directory and requesting a quote?"
  faq_a4: "These are two distinct paths to finding the right professional. In the directory, you actively search and directly contact the pro of your choice. With the quote request, you post your project and professionals come to you with their offers. Both are 100% free and with no commitment.<br><br>→ Directory → You choose and contact directly<br>→ Quote → Pros come to you with their best offers<br>→ Combine both approaches to maximise your options"
  faq_q5: "What categories of professionals can I find on Drilleedo?"
  faq_a5: "Drilleedo goes far beyond simple construction. Our directory covers 4 major categories to meet all your residential needs.<br><br>→ General Contractors — Construction, full renovation, extensions<br>→ Specialist Contractors — Plumbing, electrical, roofing, painting, tiling<br>→ Other Professionals — Moving, gardening, housekeeping, cleaning<br>→ Smart Idea — Architects and designers for your inspiration projects"
  faq_q6: "Is Drilleedo available across Canada?"
  faq_a6: "Drilleedo is available in the main Canadian provinces — Quebec, Ontario, Alberta and British Columbia — with ongoing expansion to new regions. Enter your city or postal code when searching to see professionals available near you.<br><br>→ Available in Quebec, Ontario, Alberta and B.C.<br>→ Hundreds of verified professionals in each province<br>→ Constant expansion — new regions added regularly"
  faq_q7: "What should I do if I can't find a professional in my area?"
  faq_a7: "If no professional matches your search in your area, we recommend using the quote request feature. Post your project — our team actively broadcasts it to available professionals. You can also expand your search area or contact us directly for help.<br><br>→ Use the quote request to broaden your reach<br>→ Expand your geographic search area<br>→ Contact our team — we'll help you find the solution"
  faq_q8: "How do I leave a review on a professional?"
  faq_a8: "Once your project is complete, Drilleedo invites you to leave a review on the professional you worked with. This review is visible to the entire community and helps maintain the quality of our network. Your feedback is valuable — it protects future clients and rewards the best pros.<br><br>→ Automatic invitation once your project is complete<br>→ Rating on quality, deadlines and professionalism<br>→ Review published and visible to the entire Drilleedo community<br>→ Your review is verified — zero manipulation possible"
  # CTA final
  final_tag: "Search. Compare. Choose. — Free. Always."
  final_h2: "The right pro"
  final_h2_span: "was just waiting for you."
  final_sub: "Drilleedo connects you with certified professionals. Free. No commitment. Always."
  final_cta1: "Browse the directory — free & no commitment"
