  val_6_title: "Innovation"
  val_6_desc: "We constantly improve our platform with new tools and features to make home improvement easier, smarter, and more accessible."
  mv_eyebrow: "Mission & Vision"
  mv_title: "Driving the Future of Home Services"
  mv_lbl_mission: "Our Mission"
  mv_title_mission: "Making Home Services Easier, Smarter & Reliable"
  mv_desc_mission: "We are dedicated to providing a seamless experience for both homeowners and professionals, ensuring every renovation project starts with confidence and ends with excellence. We believe every Canadian deserves access to quality, affordable home services."
  mv_lbl_vision: "Our Vision"
  mv_title_vision: "Canada's #1 Marketplace for Home Services"
  mv_desc_vision: "To become the leading marketplace for home renovation and improvement services in Canada — powered by innovative technology, driven by a community of trusted professionals, and measured by the satisfaction of every homeowner we serve."
  why_eyebrow: "Why Drilleedo"
  why_title_1: "Why Thousands of Canadians "
  why_title_2: "Choose Us"
  why_sub: "We go beyond connecting homeowners with contractors. We guarantee peace of mind from the first click to the final nail."
  why_btn_find: "Find a Pro"
  why_btn_join: "Join as Pro"
  why_lbl_1: "100% Verified Pros"
  why_desc_1: "Every contractor is background-checked and manually reviewed before joining the platform."
  why_lbl_2: "Free Quotes"
  why_desc_2: "Compare multiple quotes from verified professionals at no cost, no strings attached."
  why_lbl_3: "Certified Reviews"
  why_desc_3: "Only verified clients can leave reviews, ensuring authenticity and reliability."
  why_lbl_4: "RBQ Insured"
  why_desc_4: "Professionals on our platform carry all required licenses and insurance for your protection."
  why_lbl_5: "Fast Response"
  why_desc_5: "Get your first quote within 24 hours from professionals available in your area."
  why_lbl_6: "Dedicated Support"
  why_desc_6: "Our team is available to help homeowners and professionals at every stage of the project."
  team_eyebrow: "The Team"
  team_title: "Driven by Expertise & Innovation"
  team_sub: "Meet the visionaries building Canada's most trusted renovation marketplace."
  faq_eyebrow: "Questions"
  faq_title: "Frequently Asked Questions"
  faq_sub: "Everything you need to know about Drilleedo."
  faq_q1: "Is Drilleedo free to use for homeowners?"
  faq_a1: "Yes, absolutely! Drilleedo is completely free for homeowners. You can post projects, compare professionals, and receive quotes at zero cost. We earn a small commission from professionals only when a project is successfully matched."
  faq_q2: "How are professionals verified on the platform?"
  faq_a2: "Every professional goes through a manual verification process that includes identity check, license verification (RBQ where applicable), insurance confirmation, and a review of past work samples. Only then can they appear on the platform."
  faq_q3: "Can I compare multiple quotes before hiring?"
  faq_a3: "Absolutely. In fact, we encourage it. When you post a project, qualified professionals in your area can send you quotes. You can review their profiles, ratings, and pricing before making any commitment."
  faq_q4: "What happens if I'm not satisfied with a professional?"
  faq_a4: "Your satisfaction is our priority. If you experience any issues with a professional found on Drilleedo, our support team is available to mediate and help resolve disputes. All verified reviews are public and professionals are held to high standards."
  faq_q5: "How do I list my business on Drilleedo?"
  faq_a5: "Simply create an account as a professional or company, complete your profile with your services and credentials, and submit for verification. Once approved, homeowners across Canada will be able to find and contact you directly."
