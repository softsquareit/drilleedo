  faq_eyebrow: "FREQUENTLY ASKED QUESTIONS — I WANT A QUOTE"
  faq_title: "All your questions — clear answers"
  faq_title_span: "straight to the point."
  faq_q1: "How long does it take to receive my first quotes?"
  faq_a1: "In the vast majority of cases, you receive your first quotes within 24 hours of publishing your project. Professionals in your area are instantly notified as soon as your request goes live — and serious pros respond fast.<br><br>→ Instant notification to pros in your area upon publication<br>→ First quotes generally received in under 24h<br>→ A well-described project attracts quotes faster<br>→ Up to 5 competitive quotes per request"
  faq_q2: "Am I required to accept a quote I receive?"
  faq_a2: "Absolutely not. You have no obligation to accept any quote received on Drilleedo. You are entirely free to compare, exchange with professionals, negotiate — and choose whoever suits you best, or choose no one. Zero pressure. Zero commitment.<br><br>→ No obligation to accept — ever<br>→ Compare freely with no imposed deadline<br>→ Negotiate directly with pros before deciding<br>→ Cancel your request at any time with no fees or penalties"
  faq_q3: "How many quotes can I receive per project?"
  faq_a3: "You can receive up to 5 quotes per project request. This number is intentionally limited so you can compare serious, high-quality offers — rather than being overwhelmed by a flood of proposals. Each quote comes from a verified, active professional on Drilleedo.<br><br>→ Maximum 5 quotes per project — for clear comparisons<br>→ Every bidder is a verified and active pro<br>→ Quality guaranteed over quantity — serious offers only<br>→ Ask questions to each pro before deciding"
  faq_q4: "Is it really free to request a quote?"
  faq_a4: "Yes — 100% free. No exceptions. Describing your project, receiving quotes, comparing offers, and contacting professionals costs you nothing. No subscription, no connection fees, no hidden commission. On Drilleedo — clients never pay to find their pro.<br><br>→ No project posting fee<br>→ No quote reception fee<br>→ No commission on the accepted contract<br>→ As many requests as you want — unlimited and always free"
  faq_q5: "How can I best describe my project to receive better quotes?"
  faq_a5: "The quality of your description directly determines the quality of the quotes you receive. The more precise and detailed your project is, the better professionals can submit tailored and competitive offers. Take 5 extra minutes — and save hours of back-and-forth.<br><br>→ Describe the work to be done precisely — be specific<br>→ Add photos — a picture is worth a thousand words<br>→ State your estimated budget — even an approximate range helps<br>→ Specify your desired timeline — when do you want to start?<br>→ Mention any special constraints — access, schedules, materials"
  faq_q6: "What types of projects can I submit on Drilleedo?"
  faq_a6: "Drilleedo accepts all requests related to your home and property — from construction work to everyday services. If it concerns your house, your land, or your living space — we have the professional you need.<br><br>→ Renovation, construction and additions<br>→ Plumbing, electrical, roofing, insulation, windows<br>→ Painting, tiling, flooring, kitchen, bathroom<br>→ Moving, gardening, housekeeping<br>→ And much more — submit your project even if you're not sure"
  faq_q7: "Can I make multiple quote requests at the same time?"
  faq_a7: "Yes — with no limit whatsoever! You can post as many projects as you like, simultaneously or not, and receive quotes for each of them. Each request is handled independently and broadcast to professionals matching your specific need.<br><br>→ As many simultaneous projects as you want — no restrictions<br>→ Each project receives its own independent quotes<br>→ Manage all your projects from your centralized dashboard"
  faq_q8: "What happens after I accept a quote?"
  faq_a8: "Once you have chosen the quote that suits you, you enter into direct contact with the professional to finalize the details — contract, schedule, payment terms. Drilleedo facilitates the connection, but the professional relationship and contractual terms are managed directly between you and the pro.<br><br>→ Exchange directly with the pro to finalize details<br>→ Schedule the start of work according to your mutual availability<br>→ Establish a clear contract — protect yourself and the pro<br>→ Rate the professional once the project is done — contribute to the community"
  final_tag: "Describe. Receive. Choose."
  final_h2: "Your project deserves"
  final_h2_span: "the best offers"
  final_sub: "Drilleedo brings them to you. Free. No commitment. No credit card. No limit on requests. Ever."
  final_cta1: "I post my project — and I receive my quotes for free"
  final_cta2: "Explore pros"

