  faq_title_span: "Drilleedo?"
  faq_sub: "Everything you need to know about billing, leads, and using the platform."
  faq_q1: "What is Drilleedo and how does it work for pros?"
  faq_a1: "Drilleedo is a renovation platform that connects trusted Canadian service providers with homeowners. As a pro, you build a profile, select your service areas, and receive direct quote requests from clients looking precisely for your expertise. No commission fees on your jobs."
  faq_q2: "Is Drilleedo free to use?"
  faq_a2: "Yes! Registration and basic profile creation are completely free. You can browse the leads board right away. Our paid \"Growth\" and \"Premium\" plans are optional and designed to accelerate your visibility and guarantee exclusive access to leads."
  faq_q3: "Can I change or cancel my plan at any time?"
  faq_a3: "Absolutely. There are no locking contracts. You can upgrade, downgrade, or cancel your subscription at any point directly from your billing dashboard. Cancellations take effect at the end of your current billing cycle."
  faq_q4: "How do I get the \"Verified\" badge?"
  faq_a4: "The Drilleedo Verified Badge requires a manual check by our team. Once you're on a Growth or Premium plan, you will upload proof of identity, liability insurance, and your RBQ license (or local equivalent). Once approved, the badge boosts your conversion rate significantly."

