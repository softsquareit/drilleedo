  step2_title: "Complete Verification (Badge)"
  step2_desc: "Our team reviews your submission. By uploading a government ID and confirming business licenses (like RBQ), you earn the authoritative <em>Drilleedo Verified Badge</em>. High-trust profiles receive up to 3x more direct quotes from site visitors."
  step3_lbl: "Step 03"
  step3_title: "Receive Direct Requests"
  step3_desc: "Homeowners browse the marketplace and find your profile in local search results. When your work matches their vision, they click 'Request Quote' to message you directly. You get an instant notification via your dashboard and email."
  step4_lbl: "Step 04"
  step4_title: "Quote, Hire, and Review"
  step4_desc: "Discuss the project specifics, visit the site, and secure the contract on your own terms (we take absolutely zero commission). After completion, we help collect a certified review to continuously boost your ranking."
