  faq_title: "Questions from Professionals"
  faq_q1: "How much does it cost to list my business?"
  faq_a1: "Creating a Starter profile on Drilleedo is completely free and has no time limit. You can receive quote requests and reviews without paying anything. Our Professional plan at $29/month unlocks priority listing, the verified badge, and advanced analytics."
  faq_q2: "Do I pay a commission on every project I win?"
  faq_a2: "No. Drilleedo operates on a subscription model, not a commission model. Once a homeowner contacts you and you agree on a project, 100% of the contract value is yours. We never take a cut of your earnings."
  faq_q3: "How long does the verification process take?"
  faq_a3: "Most verification reviews are completed within 1–3 business days. You'll need to provide a valid government ID, your RBQ license number (if applicable), and proof of liability insurance. Once verified, the badge appears on your profile immediately."
  faq_q4: "Can I control which types of projects I receive?"
  faq_a4: "Yes. During profile setup you define your service categories, service zone radius, and the types of projects you accept. Homeowners who match your criteria will be able to find and contact you — you're always in control."
  faq_q5: "Do I need a website or portfolio to get started?"
  faq_a5: "Not at all. Your Drilleedo profile acts as your professional website. You can upload project photos, write a bio, list your services, and collect reviews — all within the platform. Many professionals use Drilleedo as their primary online presence."

