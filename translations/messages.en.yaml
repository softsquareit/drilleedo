  faq_eyebrow: "FREQUENTLY ASKED QUESTIONS — I AM A PROFESSIONAL"
  faq_title: "All your questions about Drilleedo — clear and straight answers."
  faq_q1: "What is the difference between the Standard and Premium subscription?"
  faq_a1: "Both subscriptions share the same absolute rule: 0% commission on your contracts — ever. The main difference lies in your visibility and client opportunities. The Standard subscription gives you access to quote requests. The Premium subscription also boosts you into our exclusive directory — visible to thousands of serious clients.<br><br>→ Standard → Access to quote requests + active profile + 0% commission<br>→ Premium → Everything in Standard + directory visibility + featured profile + top results<br>→ Both → 100% of your revenue kept — no exceptions<br>→ Premium → Up to +40% more requests from the 1st month"
  faq_q2: "How does the no-commission model work?"
  faq_a2: "It's simple — and revolutionary. You pay a fixed monthly subscription, and every dollar you earn on your contracts is entirely yours. Drilleedo never takes a percentage of your revenue. Ever. A $10,000 contract? You keep $10,000. Minus your monthly subscription. That's it.<br><br>→ Fixed monthly subscription — that's all you pay<br>→ 0% commission on every contract — now and forever<br>→ Zero referral fees — ever<br>→ Zero contract closing fees — ever<br>→ Your revenue is yours — entirely and permanently"
  faq_q3: "How long does it take for my profile to go live?"
  faq_a3: "Your profile goes live within 24 hours of signing up and activating your subscription. Our team quickly verifies your information and certifications to ensure the quality of our network. Once approved — you're visible and start receiving requests.<br><br>→ Quick sign-up — takes just a few minutes<br>→ Verification of certifications and licenses by our team<br>→ Profile active and visible in under 24h<br>→ Potential first requests from day one"
  faq_q4: "Can I choose which projects I respond to?"
  faq_a4: "Absolutely — and that's one of Drilleedo's major advantages. You are completely free to choose which requests you want to respond to. Review the full details of each project — budget, location, type of work, timeline — and submit only on the opportunities that truly match you.<br><br>→ Complete freedom to select your projects<br>→ View all details before responding<br>→ No obligation to respond to every request<br>→ Focus on profitable and accessible projects"
  faq_q5: "How can I receive more requests and maximize my visibility?"
  faq_a5: "Several factors directly influence the volume of requests you receive. A complete and polished profile attracts significantly more clients than an incomplete one. The Premium subscription pushes you to the top of search results — and multiplies your opportunities.<br><br>→ Complete 100% of your profile — photo, certifications, portfolio, description<br>→ Add as many project photos as possible — before/after<br>→ Actively collect client reviews after each successful project<br>→ Clearly define your service zones and specialties<br>→ Opt for the Premium subscription to appear at the top of results<br>→ Respond quickly to requests — responsive pros are favored"
  faq_q6: "Can I change my subscription along the way?"
  faq_a6: "Yes — at any time and without penalty. You can switch from Standard to Premium whenever you want, or vice versa. Your subscription adapts to your activity and ambitions — not the other way around. Contact our team or manage it directly from your dashboard.<br><br>→ Switch Standard → Premium at any time<br>→ Switch Premium → Standard possible without penalty<br>→ Change effective immediately or at next billing cycle<br>→ Our team guides you in your choice"
  faq_q7: "How does the 'Verified Professional' badge work?"
  faq_a7: "The 'Verified Professional' badge is awarded after our team verifies your certifications, licenses, and business information. It appears on your profile and signals to potential clients that you are a serious, approved, and trustworthy professional. This badge is a powerful conversion argument — clients actively seek it out.<br><br>→ Verification of your certifications and licenses (RBQ, CCQ, etc.)<br>→ Badge visible on your profile in the directory<br>→ Immediately builds trust with potential clients<br>→ Premium subscribers receive an additional Premium badge"
  faq_q8: "How do I contact Drilleedo support if I need help?"
  faq_a8: "Our team is available to guide you at every step — from creating your profile to optimizing your business. Whether you have a technical question, a subscription issue, or need advice to maximize your results — we're here.<br><br>→ Support available via integrated messaging in your dashboard<br>→ Response guaranteed within 24 business hours<br>→ Guides and tutorials available in your professional space<br>→ Personalized coaching for profile optimization"

  final_eyebrow: "Join the Pros Who Chose Drilleedo"
  final_title: "Your Only Limit — is Your Ambition."
  final_sub: "Others build their success on your back. At Drilleedo — we build yours."
  final_cta1: "I Create My Profile — and My Next Clients Are Already Waiting!"
  final_cta2: "I Want the Premium Plan — and I Dominate My Market"

