  faq_eyebrow: "FAQ"
  faq_title: "Des questions sur"
  faq_title_span: "Drilleedo ?"
  faq_sub: "Tout ce que vous devez savoir sur la facturation, les prospects et l'utilisation de la plateforme."
  faq_q1: "Qu'est-ce que Drilleedo et comment ça fonctionne pour les pros ?"
  faq_a1: "Drilleedo est une plateforme de rénovation qui connecte des prestataires de services canadiens de confiance avec des propriétaires. En tant que pro, vous créez un profil, sélectionnez vos zones de service et recevez des demandes de soumissions directes de clients à la recherche de votre expertise. Aucune commission sur vos travaux."
  faq_q2: "Drilleedo est-il gratuit à utiliser ?"
  faq_a2: "Oui ! L'inscription et la création d'un profil de base sont complètement gratuites. Vous pouvez consulter le tableau des prospects immédiatement. Nos forfaits payants «&nbsp;Croissance&nbsp;» et «&nbsp;Premium&nbsp;» sont optionnels et conçus pour accélérer votre visibilité et garantir un accès exclusif aux prospects."
  faq_q3: "Puis-je changer ou annuler mon forfait à tout moment ?"
  faq_a3: "Absolument. Il n'y a aucun contrat contraignant. Vous pouvez mettre à niveau, rétrograder ou annuler votre abonnement à tout moment directement depuis votre tableau de bord de facturation. Les annulations prennent effet à la fin de votre cycle de facturation en cours."
  faq_q4: "Comment obtenir le badge «&nbsp;Vérifié&nbsp;» ?"
  faq_a4: "Le badge Drilleedo Vérifié nécessite une vérification manuelle par notre équipe. Une fois sur un forfait Croissance ou Premium, vous téléchargez une preuve d'identité, une assurance responsabilité civile et votre licence RBQ (ou équivalent local). Une fois approuvé, le badge augmente significativement votre taux de conversion."

