  faq_q1: "Combien cela coûte-t-il d'inscrire mon entreprise ?"
  faq_a1: "La création d'un profil Débutant sur Drilleedo est entièrement gratuite et sans limite de temps. Vous pouvez recevoir des demandes de devis sans rien payer. Notre forfait Professionnel à 29$/mois débloque le classement prioritaire, le badge vérifié et les analyses avancées."
  faq_q2: "Dois-je payer une commission sur chaque projet remporté ?"
  faq_a2: "Non. Drilleedo fonctionne sur un modèle d'abonnement, pas de commission. Une fois qu'un propriétaire vous contacte et que vous vous mettez d'accord sur un projet, 100 % de la valeur du contrat vous appartient."
  faq_q3: "Combien de temps prend le processus de vérification ?"
  faq_a3: "La plupart des vérifications sont complétées en 1 à 3 jours ouvrables. Vous devrez fournir une pièce d'identité valide, votre numéro de licence RBQ (le cas échéant) et une preuve d'assurance responsabilité. Une fois vérifié, le badge apparaît immédiatement."
  faq_q4: "Puis-je contrôler quels types de projets je reçois ?"
  faq_a4: "Oui. Lors de la configuration du profil, vous définissez vos catégories de services, le rayon de votre zone et les types de projets. Les propriétaires correspondant à vos critères pourront vous trouver."
  faq_q5: "Ai-je besoin d'un site web ou d'un portfolio pour commencer ?"
  faq_a5: "Pas du tout. Votre profil Drilleedo agit comme votre site pro. Vous pouvez télécharger des photos, écrire une bio, lister vos services et collecter des avis — le tout sur la plateforme."

