  lead_title_1: "À quoi ressemble un projet "
  lead_title_2: "Drilleedo ?"
  lead_sub: "Tous les prospects ne se valent pas. Nous pré-filtrons l'intention des utilisateurs afin que vous ne passiez du temps qu'avec des clients prêts à s'engager."
  lead_hdr_title: "L'anatomie d'une demande parfaite"
  lead_hdr_sub: "Chaque message direct que vous recevez inclut le contexte vital du projet."
  lead_card1_title: "Correspondance géographique"
  lead_card1_desc: "Nous vérifions que le code postal du projet se situe bien à l'intérieur du rayon de service actif que vous avez défini dans votre tableau de bord."
  lead_card2_title: "Description claire"
  lead_card2_desc: "Les clients sont invités à fournir des détails spécifiques, évitant ainsi les demandes vagues. Vous saurez si c'est une réparation rapide ou une rénovation totale."
  lead_card3_title: "Connexion directe"
  lead_card3_desc: "Vous possédez immédiatement la relation client. Pas d'enchères à l'aveugle. Le client a spécifiquement choisi votre profil en fonction de votre travail."
