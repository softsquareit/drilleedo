  faq_eyebrow: "QUESTIONS FRÉQUENTES — JE SUIS PROFESSIONNEL"
  faq_title: "Toutes vos questions sur Drilleedo — des réponses claires et sans détour."
  faq_q1: "Quelle est la différence entre l’abonnement Standard et l’abonnement Premium ?"
  faq_a1: "Les deux abonnements partagent la même règle absolue : 0% de commission sur vos contrats — jamais. La différence principale réside dans votre visibilité et vos opportunités de clients. L’abonnement Standard vous donne accès aux demandes de soumissions. L’abonnement Premium vous propulse en plus dans notre annuaire exclusif — visible par des milliers de clients sérieux.<br><br>→ Standard → Accès aux demandes de soumissions + profil actif + 0% commission<br>→ Premium → Tout le Standard + visibilité annuaire + profil mis en avant + top résultats<br>→ Les deux → 100% de vos revenus conservés — sans exception<br>→ Premium → Jusqu’à +40% de demandes supplémentaires dès le 1er mois"
  faq_q2: "Comment fonctionne le modèle sans commission ?"
  faq_a2: "C’est simple — et c’est révolutionnaire. Vous payez un abonnement mensuel fixe, et chaque dollar que vous gagnez sur vos contrats vous appartient entièrement. Drilleedo ne prélève jamais de pourcentage sur vos revenus. Jamais. Un contrat de 10 000$ ? Vous gardez 10 000$. Moins votre abonnement mensuel. C’est tout.<br><br>→ Abonnement mensuel fixe — c’est tout ce que vous payez<br>→ 0% de commission sur chaque contrat — maintenant et pour toujours<br>→ Zéro frais de mise en relation — jamais<br>→ Zéro frais de clôture de contrat — jamais<br>→ Vos revenus sont vôtres — entièrement et définitivement"
  faq_q3: "Combien de temps faut-il pour que mon profil soit actif ?"
  faq_a3: "Votre profil est actif en moins de 24 heures suivant votre inscription et l’activation de votre abonnement. Notre équipe vérifie vos informations et certifications rapidement pour garantir la qualité de notre réseau. Dès validation — vous êtes visible et commencez à recevoir des demandes.<br><br>→ Inscription rapide — quelques minutes suffisent<br>→ Vérification des certifications et licences par notre équipe<br>→ Profil actif et visible en moins de 24h<br>→ Premières demandes potentielles dès le premier jour"
  faq_q4: "Puis-je choisir les projets auxquels je réponds ?"
  faq_a4: "Absolument — et c’est l’un des grands avantages de Drilleedo. Vous êtes entièrement libre de choisir les demandes auxquelles vous souhaitez répondre. Consultez les détails de chaque projet — budget, localisation, type de travaux, délai — et soumettez uniquement sur les opportunités qui vous correspondent vraiment.<br><br>→ Liberté totale de sélectionner vos projets<br>→ Consultez tous les détails avant de répondre<br>→ Aucune obligation de répondre à toutes les demandes<br>→ Concentrez-vous sur les projets rentables et accessibles"
  faq_q5: "Comment recevoir plus de demandes et maximiser ma visibilité ?"
  faq_a5: "Plusieurs facteurs influencent directement le volume de demandes que vous recevez. Un profil complet et soigné attire significativement plus de clients qu’un profil incomplet. L’abonnement Premium vous propulse en tête des résultats de recherche — et multiplie vos opportunités.<br><br>→ Complétez 100% de votre profil — photo, certifications, portfolio, description<br>→ Ajoutez un maximum de photos de réalisations — avant/après<br>→ Collectez activement des avis clients après chaque projet réussi<br>→ Précisez clairement vos zones d’intervention et spécialités<br>→ Optez pour l’abonnement Premium pour apparaître en tête des résultats<br>→ Répondez rapidement aux demandes — les pros réactifs sont favorisés"
  faq_q6: "Puis-je modifier mon abonnement en cours de route ?"
  faq_a6: "Oui — à tout moment et sans pénalité. Vous pouvez passer de l’abonnement Standard à l’abonnement Premium quand vous le souhaitez, ou l’inverse. Votre abonnement s’adapte à votre activité et à vos ambitions — pas l’inverse. Contactez notre équipe ou gérez directement depuis votre tableau de bord.<br><br>→ Passage Standard → Premium à tout moment<br>→ Passage Premium → Standard possible sans pénalité<br>→ Modification effective immédiatement ou au prochain cycle<br>→ Notre équipe vous accompagne dans votre choix"
  faq_q7: "Comment fonctionne le badge ‘Professionnel vérifié’ ?"
  faq_a7: "Le badge ‘Professionnel vérifié’ est attribué après vérification de vos certifications, licences et informations d’entreprise par notre équipe. Il apparaît sur votre profil et signale aux clients potentiels que vous êtes un professionnel sérieux, approuvé et digne de confiance. Ce badge est un puissant argument de conversion — les clients le recherchent activement.<br><br>→ Vérification de vos certifications et licences (RBQ, CCQ, etc.)<br>→ Badge visible sur votre profil dans l’annuaire<br>→ Renforce immédiatement la confiance des clients potentiels<br>→ Les abonnés Premium bénéficient d’un badge Premium supplémentaire"
  faq_q8: "Comment contacter le support Drilleedo si j’ai besoin d’aide ?"
  faq_a8: "Notre équipe est disponible pour vous accompagner à chaque étape — de la création de votre profil à l’optimisation de votre activité. Que vous ayez une question technique, un problème avec votre abonnement ou besoin de conseils pour maximiser vos résultats — nous sommes là.<br><br>→ Support disponible via la messagerie intégrée de votre tableau de bord<br>→ Réponse garantie dans les 24 heures ouvrables<br>→ Guides et tutoriels disponibles dans votre espace professionnel<br>→ Accompagnement personnalisé pour l’optimisation de votre profil"

  final_eyebrow: "Rejoignez les pros qui ont choisi Drilleedo"
  final_title: "Votre seule limite — c’est votre ambition."
  final_sub: "Les autres bâtissent leur succès sur votre dos. Chez Drilleedo — on bâtit le vôtre."
  final_cta1: "Je crée mon profil — et mes prochains clients m’attendent déjà !"
  final_cta2: "Je veux l’abonnement Premium — et je domine mon marché"

