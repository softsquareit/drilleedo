  faq_eyebrow: "QUESTIONS FRÉQUENTES — JE VEUX UNE SOUMISSION"
  faq_title: "Toutes vos questions — des réponses"
  faq_title_span: "claires et sans détour."
  faq_q1: "Combien de temps faut-il pour recevoir mes premières soumissions ?"
  faq_a1: "Dans la grande majorité des cas, vous recevez vos premières soumissions en moins de 24 heures suivant la publication de votre projet. Les professionnels de votre région sont notifiés instantanément dès que votre demande est diffusée — et les pros sérieux répondent vite.<br><br>→ Notification instantanée aux pros de votre région dès la publication<br>→ Premières soumissions généralement reçues en moins de 24h<br>→ Un projet bien décrit reçoit des soumissions plus rapidement<br>→ Jusqu'à 5 soumissions compétitives par demande"
  faq_q2: "Suis-je obligé d'accepter une soumission reçue ?"
  faq_a2: "Absolument pas. Vous n'avez aucune obligation d'accepter une soumission reçue sur Drilleedo. Vous êtes entièrement libre de comparer, d'échanger avec les professionnels, de négocier — et de choisir celui qui vous convient le mieux, ou de ne choisir personne. Zéro pression. Zéro engagement.<br><br>→ Aucune obligation d'accepter — jamais<br>→ Comparez librement sans délai imposé<br>→ Négociez directement avec les pros avant de décider<br>→ Annulez votre demande à tout moment sans frais ni pénalité"
  faq_q3: "Combien de soumissions puis-je recevoir par projet ?"
  faq_a3: "Vous pouvez recevoir jusqu'à 5 soumissions par demande de projet. Ce nombre est volontairement limité pour vous permettre de comparer des offres sérieuses et qualitatives — plutôt que de vous noyer dans une multitude de propositions. Chaque soumission vient d'un professionnel vérifié et actif sur Drilleedo.<br><br>→ Maximum 5 soumissions par projet — pour des comparaisons claires<br>→ Chaque soumissionnaire est un pro vérifié et actif<br>→ Qualité garantie avant quantité — des offres sérieuses uniquement<br>→ Posez des questions à chaque pro avant de décider"
  faq_q4: "Est-ce vraiment gratuit de demander une soumission ?"
  faq_a4: "Oui — 100% gratuit. Sans exception. Décrire votre projet, recevoir des soumissions, comparer les offres et contacter les professionnels ne vous coûte rien. Pas d'abonnement, pas de frais de mise en relation, pas de commission cachée. Sur Drilleedo — les clients ne paient jamais pour trouver leur pro.<br><br>→ Aucun frais de publication de projet<br>→ Aucun frais de réception de soumissions<br>→ Aucune commission sur le contrat accepté<br>→ Autant de demandes que vous voulez — sans limite et sans frais"
  faq_q5: "Comment bien décrire mon projet pour recevoir de meilleures soumissions ?"
  faq_a5: "La qualité de votre description détermine directement la qualité des soumissions reçues. Plus votre projet est précis et détaillé, plus les professionnels pourront vous soumettre des offres adaptées et compétitives. Prenez 5 minutes supplémentaires — et économisez des heures de va-et-vient.<br><br>→ Décrivez précisément les travaux à réaliser — soyez spécifique<br>→ Ajoutez des photos — une image vaut mille mots<br>→ Indiquez votre budget estimé — même une fourchette approximative aide<br>→ Précisez votre délai souhaité — quand voulez-vous commencer ?<br>→ Mentionnez les contraintes particulières — accès, horaires, matériaux"
  faq_q6: "Quels types de projets puis-je soumettre sur Drilleedo ?"
  faq_a6: "Drilleedo accepte toutes les demandes liées à votre domicile et votre propriété — des travaux de construction aux services du quotidien. Si ça concerne votre maison, votre terrain ou votre espace de vie — nous avons le professionnel qu'il vous faut.<br><br>→ Rénovation, construction et agrandissement<br>→ Plomberie, électricité, toiture, isolation, fenêtres<br>→ Peinture, carrelage, plancher, cuisine, salle de bain<br>→ Déménagement, jardinage, entretien ménager<br>→ Et bien plus — soumettez votre projet même si vous doutez"
  faq_q7: "Puis-je faire plusieurs demandes de soumissions en même temps ?"
  faq_a7: "Oui — et sans aucune limite ! Vous pouvez publier autant de projets que vous le souhaitez, simultanément ou non, et recevoir des soumissions pour chacun d'eux. Chaque demande est traitée indépendamment et diffusée aux professionnels correspondant à votre besoin spécifique.<br><br>→ Autant de projets simultanés que vous voulez — sans restriction<br>→ Chaque projet reçoit ses propres soumissions indépendantes<br>→ Gérez tous vos projets depuis votre tableau de bord centralisé"
  faq_q8: "Que se passe-t-il après avoir accepté une soumission ?"
  faq_a8: "Une fois que vous avez choisi la soumission qui vous convient, vous entrez en contact direct avec le professionnel pour finaliser les détails — contrat, calendrier, modalités de paiement. Drilleedo facilite la connexion, mais la relation professionnelle et les modalités contractuelles se gèrent directement entre vous et le pro.<br><br>→ Échangez directement avec le pro pour finaliser les détails<br>→ Planifiez le démarrage des travaux selon vos disponibilités mutuelles<br>→ Établissez un contrat clair — protégez-vous et protégez le pro<br>→ Évaluez le professionnel une fois le projet terminé — contribuez à la communauté"
  final_tag: "Décrivez. Recevez. Choisissez."
  final_h2: "Votre projet mérite"
  final_h2_span: "meilleures offres"
  final_sub: "Drilleedo les ramène à vous. Gratuit. Sans engagement. Sans carte de crédit. Pas de limite de demandes. Jamais."
  final_cta1: "Je publie mon projet — et je reçois mes soumissions gratuitement"
  final_cta2: "Explorer les pros"

