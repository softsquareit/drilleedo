  faq_a1: "Oui, absolument ! Drilleedo est 100% gratuit pour les propriétaires. Vous pouvez soumettre des projets et comparer les devis sans aucun frais."
  faq_q2: "Comment les professionnels sont-ils vérifiés ?"
  faq_a2: "Chaque pro passe par une vérification stricte : identité, licences (RBQ), assurances et un examen d'anciens travaux."
  faq_q3: "Puis-je comparer plusieurs devis avant d'engager ?"
  faq_a3: "Absolument, c'est même conseillé ! Des pros qualifiés de votre région enverront leurs devis, et vous comparez leurs profils et prix."
  faq_q4: "Que se passe-t-il si je ne suis pas satisfait ?"
  faq_a4: "Votre satisfaction est notre priorité. En cas de problème, notre équipe intervient pour aider à la médiation."
  faq_q5: "Comment inscrire mon entreprise sur Drilleedo ?"
  faq_a5: "Il suffit de créer un compte professionnel, de compléter votre profil, et de valider l'étape de vérification de compte."
  cta_eyebrow: "Commencez Dès Aujourd'hui"
  cta_title: "Prêt à Démarrer Votre Prochain Projet ?"
  cta_sub: "Connectez-vous avec des pros vérifiés et donnez vie à vos idées. Devis gratuits, sans engagement."
  cta_btn_find: "Trouver un Professionnel"
  cta_btn_join: "Devenir Pro"
  cta_btn_publish: "Je publie mon projet"
  # Stats strip
  stat_no_commission_lbl: "de commission prélevée"
  stat_active_lbl: "profil actif"
  stat_coast_val: "D'un océan à l'autre"
  stat_coast_lbl: "présence pancanadienne"
  # Story
  story_img_alt: "Le constat qui a tout changé"
  story_badge_num: "14M"
  story_badge_lbl: "logements résidentiels au Canada"
  story_p1: "Au Canada, des millions de personnes cherchent chaque année un professionnel qualifié pour leurs projets résidentiels. Pourtant, le processus reste chaotique, opaque et souvent décevant."
  story_p2: "Des recherches interminables. Des appels sans réponse. Des devis qui n'arrivent jamais. Et au bout du chemin — un choix fait dans l'incertitude, en espérant que tout se passe bien."
  story_p3: "De l'autre côté — des milliers de professionnels talentueux, qualifiés et certifiés qui peinent à se faire connaître. Qui paient des fortunes en marketing. Qui cèdent une part de leurs revenus à des plateformes qui ne comprennent pas leur réalité."
  # Vision list
  mv_vision_li1: "Chaque projet trouve son expert en quelques minutes"
  mv_vision_li2: "Chaque pro se développe librement, sans partager ses revenus"
  mv_vision_li3: "La confiance entre clients et pros est la norme — pas l'exception"
  # Values sub-labels and full body texts
  val_1_lbl: "Notre fondation absolue"
  val_1_text: "La confiance est facile à promettre. Difficile à construire. Impossible à simuler. Chez Drilleedo — on ne la promet pas. On la bâtit. <strong>Chaque professionnel vérifié. Chaque avis certifié. Chaque connexion transparente.</strong> Parce que vos projets méritent une certitude — pas un espoir."
  val_2_name: "L'équité"
  val_2_lbl: "Notre engagement envers tous"
  val_2_text: "L'équité n'est pas un concept abstrait chez Drilleedo. C'est une décision concrète, prise dès le premier jour et jamais remise en question. <strong>Gratuit d'un côté. Zéro commission de l'autre.</strong> Parce qu'un modèle équitable n'avantage pas la plateforme — il sert les personnes qui la font vivre."
  val_3_lbl: "Notre obsession quotidienne"
  val_3_text: "L'excellence n'est pas un bonus sur Drilleedo — c'est le ticket d'entrée. Chaque professionnel dans notre réseau a été sélectionné parce qu'il le mérite. <strong>L'excellence, on ne la promet pas. On la garantit</strong> — à chaque profil, à chaque projet, à chaque connexion."
  val_5_lbl: "Notre raison d'être"
  val_5_text: "Drilleedo n'est pas qu'une plateforme de mise en relation. C'est une communauté vivante — faite de clients satisfaits, de professionnels épanouis et de projets réussis. <strong>Chaque avis laissé renforce la confiance collective. Chaque connexion réussie inspire la suivante.</strong>"
  val_6_lbl: "Notre moteur permanent"
  val_6_text: "L'innovation chez Drilleedo n'est pas une case à cocher. C'est une culture. Celle de se remettre en question chaque jour. De demander — <strong>comment peut-on faire mieux ? Plus simple ? Plus rapide ? Plus équitable ?</strong> Parce que le meilleur service qu'on puisse rendre au Canada — c'est de ne jamais se satisfaire de ce qui existe déjà."
  # Canada section
  canada_img_alt: "Maisons canadiennes — engagement local"
  canada_flag: "🍁 Fièrement canadien"
  canada_provinces_img: "Québec · Ontario · Alberta<br>Colombie-Britannique — et en expansion"
  canada_tag: "Engagement canadien"
  canada_title_1: "Fièrement canadien —"
  canada_title_2: "profondément engagé"
  canada_p1: "Dans un monde de plateformes globales qui promettent de tout comprendre et de tout servir — Drilleedo fait un choix différent. <strong>Le choix du local. Le choix du concret. Le choix du Canada.</strong>"
  canada_p2: "Nous connaissons les exigences de la RBQ au Québec et les standards de construction qui varient d'une province à l'autre. Nous comprenons les réalités des entrepreneurs canadiens — leurs défis, leurs ambitions, leurs marchés."
  canada_p3: "Et parce que nous sommes canadiens — <strong>chaque dollar qui circule sur Drilleedo reste dans l'économie canadienne.</strong> Chaque professionnel qui grandit grâce à nous renforce une communauté locale. Choisir Drilleedo — c'est choisir le Canada."
  canada_prov1: "🍁 Québec"
  canada_prov2: "🍁 Ontario"
  canada_prov3: "🍁 Alberta"
  canada_prov4: "🍁 C.-B."
  canada_prov5: "+ en expansion"
  # Testimonials
  testi_pill: "Ils nous font confiance"
  testi_title: "Ce que nos utilisateurs disent"
  testi_sub: "Clients et professionnels — des connexions réelles qui changent des projets de vie."
  testi_col1_lbl: "Propriétaires &amp; locataires"
  testi_col2_lbl: "Professionnels"
  testi_c1_badge: "Cherche un pro"
  testi_c1_text: "Je cherchais un électricien depuis trois semaines. En 20 minutes — j'avais trouvé trois profils vérifiés près de chez moi. Les certifications, les avis, les photos de réalisations — tout était là. J'ai choisi en confiance. Les travaux ont été parfaits."
  testi_c1_name: "Sophie M."
  testi_c1_role: "Locataire — Montréal, QC"
  testi_c2_badge: "Soumission reçue"
  testi_c2_text: "J'avais un projet de rénovation de salle de bain — aucune idée du prix ni de par où commencer. J'ai décrit mon projet en moins de 5 minutes. Le lendemain matin — j'avais 4 soumissions détaillées. Des vrais pros, des vrais prix, des vrais délais. Le tout gratuitement."
  testi_c2_name: "Marie-Claude B."
  testi_c2_role: "Propriétaire — Laval, QC"
  testi_c3_badge: "Sans engagement"
  testi_c3_text: "Ce que j'ai aimé — c'est de ne jamais me sentir obligé. J'ai publié mon projet, reçu mes soumissions, pris le temps de comparer. Aucune pression. Et au final — j'ai trouvé un professionnel exceptionnel à un prix que je n'aurais jamais négocié seul."
  testi_c3_name: "Thomas K."
  testi_c3_role: "Locataire — Ottawa, ON"
  testi_p1_badge: "Abonnement Standard"
  testi_p1_text: "J'avais des doutes au départ. Drilleedo m'a prouvé le contraire. Dès le premier mois — trois nouvelles demandes qualifiées. Des clients sérieux, avec de vrais projets. Et le meilleur — chaque contrat décroché, je le garde en entier. Zéro commission."
  testi_p1_name: "Jean-Philippe R."
  testi_p1_role: "Plombier certifié — Sherbrooke, QC"
  testi_p2_badge: "Abonnement Premium"
  testi_p2_text: "L'abonnement Premium a changé la trajectoire de mon entreprise. Mon profil apparaît en tête des résultats. Depuis que j'ai upgradé — mes demandes ont augmenté de 40 % en deux mois. D'autres plateformes me prenaient jusqu'à 20 % sur mes revenus. Avec Drilleedo — je paie mon abonnement et c'est tout."
  testi_p2_name: "Alexandre T."
  testi_p2_role: "Entrepreneur général — Toronto, ON"
  testi_p3_badge: "Premium · Vancouver"
  testi_p3_text: "Les clients qui me trouvent via Drilleedo arrivent déjà convaincus. Ils ont vu mon profil, mes certifications, mes réalisations. Mon taux de conversion a explosé. Drilleedo Premium ne coûte pas — <strong>il rapporte.</strong>"
  testi_p3_name: "Nadia F."
  testi_p3_role: "Designer d'intérieur — Vancouver, BC"

