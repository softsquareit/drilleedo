  # FAQ
  faq_eyebrow: "QUESTIONS FRÉQUENTES — JE CHERCHE UN PROFESSIONNEL"
  faq_title: "Toutes vos questions — des réponses"
  faq_title_span: "claires, honnêtes et sans détour."
  faq_q1: "Est-ce vraiment gratuit de chercher un professionnel sur Drilleedo ?"
  faq_a1: "Oui — 100% gratuit. Toujours. Sans exception. Parcourir notre annuaire, consulter les profils, lire les avis et contacter des professionnels ne vous coûte pas un sou. Pas d'abonnement, pas de frais cachés, pas de carte de crédit requise.<br><br>→ Aucune inscription obligatoire pour parcourir l'annuaire<br>→ Créez un profil gratuitement pour sauvegarder vos favoris et suivre vos échanges<br>→ Contactez autant de professionnels que vous le souhaitez — sans frais"
  faq_q2: "Comment savoir si les professionnels sont fiables ?"
  faq_a2: "Chaque professionnel visible dans notre annuaire est un abonné actif vérifié par Drilleedo. Nous contrôlons leurs certifications, licences et accréditations avant de les afficher. De plus, chaque avis sur Drilleedo provient d'un vrai client vérifié — zéro faux avis, zéro manipulation.<br><br>→ Certifications et licences RBQ vérifiées avant affichage<br>→ Avis authentiques de vrais clients Drilleedo uniquement<br>→ Seuls les pros avec abonnement actif apparaissent — zéro profil fantôme<br>→ Portfolio de réalisations réelles — photos avant/après vérifiées"
  faq_q3: "Puis-je contacter plusieurs professionnels en même temps ?"
  faq_a3: "Absolument — et c'est même recommandé ! Sur Drilleedo, vous pouvez consulter et contacter autant de professionnels que vous le souhaitez, sans aucune limite. Comparez les profils, échangez avec plusieurs pros simultanément et prenez la meilleure décision — en toute liberté.<br><br>→ Aucune limite de contacts — comparez librement<br>→ Ajoutez vos profils favoris pour les retrouver facilement<br>→ Gérez tous vos échanges depuis votre tableau de bord centralisé"
  faq_q4: "Quelle est la différence entre chercher dans l'annuaire et demander une soumission ?"
  faq_a4: "Ce sont deux parcours distincts pour trouver le bon professionnel. Dans l'annuaire, vous cherchez activement et contactez directement le pro de votre choix. Avec la demande de soumission, vous publiez votre projet et les professionnels viennent à vous avec leurs offres. Les deux sont 100% gratuits et sans engagement.<br><br>→ Annuaire → Vous choisissez et contactez directement<br>→ Soumission → Les pros viennent à vous avec leurs meilleures offres<br>→ Combinez les deux approches pour maximiser vos options"
  faq_q5: "Quelles catégories de professionnels puis-je trouver sur Drilleedo ?"
  faq_a5: "Drilleedo va bien au-delà du simple bâtiment. Notre annuaire couvre 4 grandes catégories pour répondre à tous vos besoins résidentiels.<br><br>→ Entrepreneurs généraux — Construction, rénovation complète, agrandissement<br>→ Entrepreneurs spécialisés — Plomberie, électricité, toiture, peinture, carrelage<br>→ Autres professionnels — Déménagement, jardinage, entretien ménager, nettoyage<br>→ Smart Idea — Architectes et designers pour vos projets d'inspiration"
  faq_q6: "Est-ce que Drilleedo est disponible partout au Canada ?"
  faq_a6: "Drilleedo est disponible dans les principales provinces canadiennes — Québec, Ontario, Alberta et Colombie-Britannique — avec une expansion continue vers de nouvelles régions. Entrez votre ville ou code postal lors de votre recherche pour voir les professionnels disponibles près de chez vous.<br><br>→ Disponible au Québec, Ontario, Alberta et C.-B.<br>→ Des centaines de professionnels vérifiés dans chaque province<br>→ Expansion constante — de nouvelles régions s'ajoutent régulièrement"
  faq_q7: "Que faire si je ne trouve pas de professionnel dans ma région ?"
  faq_a7: "Si aucun professionnel ne correspond à votre recherche dans votre région, nous vous recommandons d'utiliser la fonction de demande de soumission. Publiez votre projet — notre équipe le diffuse activement aux professionnels disponibles. Vous pouvez également élargir votre zone de recherche ou nous contacter directement pour être aidé.<br><br>→ Utilisez la demande de soumission pour élargir votre portée<br>→ Élargissez votre zone de recherche géographique<br>→ Contactez notre équipe — on vous aide à trouver la solution"
  faq_q8: "Comment laisser un avis sur un professionnel ?"
  faq_a8: "Une fois votre projet terminé, Drilleedo vous invite à laisser un avis sur le professionnel avec qui vous avez travaillé. Cet avis est visible par toute la communauté et contribue à maintenir la qualité de notre réseau. Votre retour d'expérience est précieux — il protège les prochains clients et récompense les meilleurs pros.<br><br>→ Invitation automatique après la fin de votre projet<br>→ Notation sur la qualité, les délais et le professionnalisme<br>→ Avis publié et visible par toute la communauté Drilleedo<br>→ Votre avis est vérifié — zéro manipulation possible"
  # CTA final
  final_tag: "Cherchez. Comparez. Choisissez. — Gratuit. Toujours."
  final_h2: "Le bon pro"
  final_h2_span: "n'attendait que vous."
  final_sub: "Drilleedo vous connecte à des professionnels certifiés. Gratuit. Sans engagement. Toujours."
  final_cta1: "Je consulte l'annuaire — gratuitement &amp; sans limite !"
  final_cta2: "Je veux des soumissions"

