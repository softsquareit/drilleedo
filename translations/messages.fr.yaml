  step1_lbl: "Étape 01"
  step1_title: "Créez votre profil professionnel"
  step1_desc: "Inscrivez-vous et créez votre vitrine virtuelle. Vous définirez vos catégories de services spécifiques, votre rayon d'intervention et téléchargerez des photos de haute qualité de vos réalisations."
  step2_lbl: "Étape 02"
  step2_title: "Complétez la vérification (Badge)"
  step2_desc: "Notre équipe examine votre dossier. En téléchargeant une pièce d'identité et en confirmant vos licences commerciales (comme la RBQ), vous obtenez le prestigieux <em>Badge Vérifié Drilleedo</em>."
  step3_lbl: "Étape 03"
  step3_title: "Recevez des demandes directes"
  step3_desc: "Les propriétaires parcourent la marketplace et trouvent votre profil dans les résultats locaux. Lorsque votre profil correspond à leur vision, ils cliquent sur 'Demander un devis' pour vous contacter. Vous recevez une notification instantanée."
  step4_lbl: "Étape 04"
  step4_title: "Devis, engagement et avis"
  step4_desc: "Discutez des spécificités du projet, visitez le site et sécurisez le contrat selon vos propres termes (nous ne prenons aucune commission). Après la réalisation, nous aidons à collecter un avis certifié pour booster en continu votre classement."
